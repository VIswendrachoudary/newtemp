version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: edna-postgres-prod
    environment:
      POSTGRES_DB: edna_platform
      POSTGRES_USER: edna_user
      POSTGRES_PASSWORD: edna_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - edna-network
    ports:
      - "5432:5432"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: edna-redis-prod
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - edna-network
    ports:
      - "6379:6379"

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: edna-minio-prod
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - edna-network
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edna-backend-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://edna_user:edna_password@postgres:5432/edna_platform
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: edna-files
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - edna-network
    ports:
      - "5000:5000"

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edna-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - edna-network
    ports:
      - "3000:3000"

  # ML Pipeline
  ml-pipeline:
    build:
      context: ./ml-pipeline
      dockerfile: Dockerfile
    container_name: edna-ml-pipeline-prod
    environment:
      DATABASE_URL: postgresql://edna_user:edna_password@postgres:5432/edna_platform
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: edna-files
    volumes:
      - ./ml-pipeline/data:/app/data
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - edna-network
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  edna-network:
    driver: bridge